<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="2048" height="2048" style="width:2048px;height:2048px"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), alpha: true, antialias: true, preserveDrawingBuffer: true });
r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#ffffff', '#445566', 2.4));
const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(0.5, 1, 2); scene.add(key);
const cam = new THREE.PerspectiveCamera(22, 1, 0.01, 100);
const q = new URLSearchParams(location.search);
new GLTFLoader().load('/models/usui-chan.glb', (g) => {
  const m = g.scene; scene.add(m);
  m.traverse((o) => { if (o.isMesh) { o.frustumCulled = false; for (const mt of [].concat(o.material)) if (mt.transparent) { mt.transparent = false; mt.alphaTest = 0.5; mt.depthWrite = true; } } });
  const box = new THREE.Box3().setFromObject(m); const s = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
  const frac = Number(q.get('frac') ?? 0.3); // fraction of height from top to frame (head/shoulders)
  const yTop = box.max.y, yC = yTop - s.y * frac / 2;
  const dist = (s.y * frac) / (2 * Math.tan((cam.fov * Math.PI) / 360)) * 1.15;
  const az = Number(q.get('az') ?? 0) * Math.PI / 180;
  cam.position.set(c.x + Math.sin(az) * dist, yC + s.y * 0.01, c.z + Math.cos(az) * dist);
  cam.lookAt(c.x, yC, c.z);
  r.render(scene, cam); document.title = 'done ' + JSON.stringify(s);
});
</script></body></html>
