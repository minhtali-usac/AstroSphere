# Mỗi thứ Hai lấy lại thị sai Hipparcos và danh sách hành tinh ngoài hệ Mặt Trời; nếu dữ liệu đổi thì mở PR.
name: Làm mới dữ liệu bầu trời

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-sky-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-sky
      - run: npm test
      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain src/data/fetched)" ]; then
            echo "Sky data unchanged."
            exit 0
          fi
          BRANCH=data/sky-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/fetched
          git commit -m "data: refresh Hipparcos parallaxes and exoplanets ($(date -u +%F))"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "data: refresh sky data" \
              --body "Weekly refresh of src/data/fetched from CDS VizieR (Hipparcos I/311) and the NASA Exoplanet Archive (pscomppars). Generated by the refresh-sky-data workflow; tests passed before this PR was opened."
          fi
